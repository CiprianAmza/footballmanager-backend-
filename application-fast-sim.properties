# Local launcher counterpart to src/main/resources/application-fast-sim.yml.
# The repository's root application.properties overrides classpath profiles,
# so these profile-specific values must also live at the root for mvn spring-boot:run.
spring.datasource.url=jdbc:h2:mem:footballmanager-fast;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.locations=classpath:db/migration/h2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
game.checkpoint.enabled=true
game.checkpoint.interval-matchdays=${CHECKPOINT_INTERVAL_MATCHDAYS:5}
game.checkpoint.max-retained=${CHECKPOINT_KEEP_LAST:5}
game.checkpoint.postgres-url=${CHECKPOINT_DB_URL}
game.checkpoint.postgres-username=${CHECKPOINT_DB_USERNAME:footballmanager}
game.checkpoint.postgres-password=${CHECKPOINT_DB_PASSWORD:footballmanager}
