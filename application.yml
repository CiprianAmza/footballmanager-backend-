spring:
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
    baseline-on-migrate: true
    baseline-version: 0
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/footballmanager}
    driverClassName: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:footballmanager}
    password: ${DB_PASSWORD:footballmanager}
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
