# Local PostgreSQL defaults. Override with deployment secrets outside development.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/footballmanager}
spring.datasource.username=${DB_USERNAME:footballmanager}
spring.datasource.password=${DB_PASSWORD:footballmanager}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.h2.console.enabled=false

server.port=8086

spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.sql.init.mode=never

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

chairman.enabled=true
cors.allowed-origins=http://localhost:4200

# ===== Hibernate batching =====
# Group INSERTs/UPDATEs of the same entity type into batch JDBC statements
# instead of one round-trip per row. Massive speedup for matchday saves where
# we write thousands of Scorer/ScorerLeaderboard/Human rows per day.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ===== Disable OpenEntityManagerInView =====
# Default true makes ONE EntityManager live for the whole HTTP request,
# so consecutive @Transactional calls within /game/advance share the same
# PersistenceContext. After processing 7 leagues sequentially, ~2500 entities
# accumulate — every save() autoflush dirty-checks all of them, causing
# linear per-comp slowdown (rating 447ms → 5031ms across comps in your log).
# Disabling forces each @Transactional method to use its own short-lived session.
spring.jpa.open-in-view=false

# ===== Face Lab (DEV ONLY) =====
# Gates DevFaceLabController (/api/dev/facelab/**) — the species-evolution voting loop
# behind the Angular /dev/face-gallery route. Deliberately absent from the packaged
# src/main/resources/application.yml, so a production boot never exposes it.
facelab.enabled=true
facelab.data-dir=face-lab/data
