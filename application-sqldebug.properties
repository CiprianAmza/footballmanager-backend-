# =============================================================
# SQL debugging profile — activate with:
#
#   mvn spring-boot:run -Dspring-boot.run.profiles=sqldebug
#   java -jar target/*.jar --spring.profiles.active=sqldebug
#
# Layered on top of the local application.properties, never on its own.
# Deliberately NOT enabled by default: a single matchday writes thousands of
# Scorer/Human rows, so full statement logging turns a season simulation into
# millions of log lines. Turn it on for one request, read it, turn it off.
# =============================================================

# ===== Statements =====
# Hibernate 6 splits statement text and bind parameters across two loggers.
# Together they reconstruct the exact SQL that hit the database.
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Returned column values. Extremely verbose — enable only when a mapping
# looks wrong and you need to see what actually came back.
#logging.level.org.hibernate.orm.jdbc.extract=TRACE

# ===== N+1 detection =====
# generate_statistics prints a per-session summary line (statements prepared,
# entities loaded, collections fetched, time spent). A request that loads 30
# entities with 30 statements is an N+1; one that loads 30 with 2 is a join.
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG

# Log only the statements that are actually slow. Useful on its own when the
# full statement log is too noisy: comment out the SQL/bind loggers above and
# keep just this to find the expensive queries in a season transition.
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=25

# ===== Transaction boundaries =====
# Shows where each transaction opens, commits and rolls back. Pairs with
# spring.jpa.open-in-view=false to confirm that a @Transactional method really
# got its own short-lived session.
logging.level.org.springframework.transaction.interceptor=TRACE
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG

# ===== Connection pool =====
# Pool exhaustion during parallel matchday simulation shows up here first.
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
#logging.level.com.zaxxer.hikari=TRACE

# ===== Output =====
# Also mirrored to a file, so the console stays readable and the statements
# can be grepped/counted afterwards, e.g.
#   grep -c 'select' target/sql-debug.log
logging.file.name=target/sql-debug.log
