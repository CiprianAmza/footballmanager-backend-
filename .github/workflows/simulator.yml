# Builds the Tactic Arena simulator package (simulator/dist) and keeps it as an artifact.
# Not run yet: written without being able to try it on GitHub.
name: simulator

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/main/**"
      - "pom.xml"
      - "simulator/**"
      - ".github/workflows/simulator.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: CiprianAmza/footballmanager-frontend-test
          path: frontend

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build the package
        run: bash simulator/build.sh frontend

      - name: Zip
        run: cd simulator && zip -qr ../tactic-arena-simulator.zip dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tactic-arena-simulator
          path: tactic-arena-simulator.zip
