        ST: { GK: 0.1, ML: 0.7, MR: 0.7, MC: 0.6, DC: 0.2, DL: 0.3, DR: 0.3, AMC: 0.8, AML: 0.7, AMR: 0.7 }
        AMC: { GK: 0.1, MC: 0.85, AML: 0.75, AMR: 0.75, ST: 0.8, ML: 0.6, MR: 0.6, DM: 0.55 }
        DM: { GK: 0.1, MC: 0.9, DC: 0.7, AMC: 0.55, DL: 0.5, DR: 0.5, ML: 0.5, MR: 0.5 }
        AML: { GK: 0.1, ML: 0.85, AMR: 0.75, AMC: 0.7, ST: 0.6, MR: 0.55, MC: 0.5, WBL: 0.5 }
